title: Unknown or Empty Event Log Entry
id: hc-evt-27-unknown-event
description: Detects unknown or empty event log entries which may indicate log tampering
author: Ironclad Security Team
date: 2025/12/09
references:
    - https://attack.mitre.org/techniques/T1070/001/
tags:
    - attack.defense_evasion
    - attack.t1070.001
logsource:
    product: windows
    service: system
detection:
    selection:
        EventID: 27
    condition: selection
falsepositives:
