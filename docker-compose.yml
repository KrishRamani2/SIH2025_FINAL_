version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # These args are passed from the environment variables set by the build script
      args:
        - INCLUDE_LINUX=${INCLUDE_LINUX:-false}
        - INCLUDE_NGINX=${INCLUDE_NGINX:-false}
        - INCLUDE_WINDOWS=${INCLUDE_WINDOWS:-false}
        - INCLUDE_TTP_LINUX=${INCLUDE_TTP_LINUX:-false}
        - INCLUDE_TTP_NGINX=${INCLUDE_TTP_NGINX:-false}
        - INCLUDE_TTP_WINDOWS=${INCLUDE_TTP_WINDOWS:-false}
    # The image name is now parameterized
    image: sih-central-custom:${IMAGE_TAG:-latest}
    container_name: sih-central-app
    ports:
      - "8000:8000"
      - "5140:5140/udp"
    volumes:
      # We still mount the database and logs for persistence
      - ./src/db:/app/src/db
      - ./collected_logs:/app/collected_logs
      # Note: Sigma_Rules are now part of the image, so we don't mount the whole directory.
      # This ensures the container runs with only the rules it was built with.
    restart: unless-stopped
